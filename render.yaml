services:
  # ===========================================================================
  # PulseOS Hospital Management System — Render Blueprint
  # Web-Based Hospital Management Showcase Service
  # ===========================================================================
  - type: web
    name: pulseos
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: NOTIFICATION_MODE
        value: console
      - key: JWT_SECRET
        generateValue: true
